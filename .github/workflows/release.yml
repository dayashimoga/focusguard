name: FocusGuard Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Certified Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Configure Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          flutter config --android-sdk /usr/local/lib/android/sdk
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis Gate
        run: flutter analyze --fatal-infos

      - name: Automated Tests & Coverage Gate (>90%)
        run: |
          flutter test --coverage
          dart run tool/calc_coverage.dart

      - name: Build Certified Release APK
        run: |
          mkdir -p build/outputs
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/outputs/focusguard-release.apk
          cd build/outputs
          sha256sum focusguard-release.apk > focusguard-release.apk.sha256
          echo "Release APK SHA256:"
          cat focusguard-release.apk.sha256

      - name: Generate Software Bill of Materials (SBOM)
        run: dart run tool/generate_sbom.dart

      - name: Generate Production Acceptance Certification Report
        run: dart run acceptance/acceptance_runner.dart --full

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/outputs/focusguard-release.apk
            build/outputs/focusguard-release.apk.sha256
            build/outputs/sbom.json
            build/outputs/acceptance.json
            build/outputs/acceptance.html
          draft: false
          prerelease: false
          generate_release_notes: true
