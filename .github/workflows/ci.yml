name: FocusGuard CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Code Quality, Security & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis (Zero Warnings / Hints)
        run: flutter analyze --fatal-infos

      - name: Execute Automated Test Suites with Coverage
        run: flutter test --coverage

      - name: Verify Code Coverage Gate (Overall >= 90%, Core Domain >= 95%)
        run: dart run tool/calc_coverage.dart

      - name: Security & Integrity Scan
        run: |
          echo "Verifying no hardcoded secrets or network endpoints..."
          ! grep -rn "http://" lib/ || echo "Checked lib for plaintext URLs"
          echo "Verifying offline guarantee (no network dependencies)..."
          dart run tool/security_audit.dart

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 14

  build-release:
    name: Build Production Release Artifacts
    needs: quality-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          mkdir -p build/outputs
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/outputs/focusguard-release.apk
          cd build/outputs
          sha256sum focusguard-release.apk > focusguard-release.apk.sha256
          echo "SHA256 Checksum:"
          cat focusguard-release.apk.sha256

      - name: Generate Software Bill of Materials (SBOM)
        run: dart run tool/generate_sbom.dart

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-release-apk
          path: |
            build/outputs/focusguard-release.apk
            build/outputs/focusguard-release.apk.sha256
            build/outputs/sbom.json
          retention-days: 30
